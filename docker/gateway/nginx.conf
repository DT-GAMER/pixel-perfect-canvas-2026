# Internal API gateway for production (replaces Kong): routes the Supabase URL
# paths to each service. Not exposed publicly; only the app talks to it.
# The services verify every request's JWT (signed with the shared JWT secret).
server {
  listen 8000;
  client_max_body_size 10m;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;

  location /auth/v1/    { proxy_pass http://auth:9999/; }
  location /rest/v1/    { proxy_pass http://rest:3000/; }
  location /storage/v1/ { proxy_pass http://storage:5000/; }
  location = /health    { return 200 "ok"; }
}
