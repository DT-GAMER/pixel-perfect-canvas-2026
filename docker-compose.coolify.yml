# Production stack for Coolify (Docker Compose build pack).
#
# Set "Docker Compose Location" to /docker-compose.coolify.yml.
# Only the `app` service is public: give it your domain in Coolify (port 3000).
# Everything else stays on the internal network.
#
# Variables:
#   - Generated by Coolify on first deploy (nothing to do):
#       SERVICE_PASSWORD_JWT          JWT secret for Auth/REST/Storage (the app
#                                     signs its API keys from it)
#       SERVICE_PASSWORD_DBSERVICE    password for the service database logins
#   - Required, set once in Coolify → Environment Variables:
#       POSTGRES_PASSWORD             superuser password of the PostgreSQL server
#       RESEND_API_KEY                Resend API key
#   - Optional (defaults below): POSTGRES_HOST/PORT/DB/USER, SITE_URL,
#       EMAIL_FROM, EMAIL_REPLY_TO, SPONSOR_ENQUIRY_EMAIL, BOOTSTRAP_ADMIN_EMAIL
#
# No secrets live in this file.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Coolify routes the domain you assign to this service to port 3000.
      - SERVICE_FQDN_APP_3000
      - NODE_ENV=production
      - PORT=3000
      # Public URL for emails, canonical links and the sitemap. If SITE_URL is
      # empty, the app falls back to Coolify's SERVICE_FQDN_APP_3000.
      - SITE_URL=${SITE_URL:-}
      # Behind Coolify's Traefik proxy, X-Forwarded-For is set by the proxy.
      - TRUST_PROXY=true
      - SUPABASE_URL=http://gateway:8000
      # The app signs its anon/service-role API keys from this secret.
      - JWT_SECRET=${SERVICE_PASSWORD_JWT}
      # Blank on purpose: pre-made keys (e.g. pasted from a local .env) would be
      # signed with a different secret and rejected (JWSInvalidSignature).
      - SUPABASE_SERVICE_ROLE_KEY=
      - SUPABASE_PUBLISHABLE_KEY=
      - RESEND_API_KEY=${RESEND_API_KEY:?Set RESEND_API_KEY in Coolify}
      - EMAIL_FROM=${EMAIL_FROM:-C8teamsummit <support@betpreneur.ng>}
      - EMAIL_REPLY_TO=${EMAIL_REPLY_TO:-C8techsummit@gmail.com}
      - SPONSOR_ENQUIRY_EMAIL=${SPONSOR_ENQUIRY_EMAIL:-C8techsummit@gmail.com}
      # Signing in at /admin/login with this email creates the first admin
      # (only while no staff exist). Leave empty afterwards.
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      gateway:
        condition: service_started

  # One-shot: creates the roles and schemas the Supabase services need (idempotent).
  bootstrap:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    restart: "no"
    exclude_from_hc: true
    entrypoint: ["sh", "-c", "until pg_isready -d \"$$DATABASE_URL\" -q; do sleep 2; done; psql \"$$DATABASE_URL\" -X -q -v ON_ERROR_STOP=1 -v svc_pass=\"$$DB_SERVICE_PASSWORD\" -f /bootstrap.sql"]
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}@${POSTGRES_HOST:-62.238.60.119}:${POSTGRES_PORT:-6000}/${POSTGRES_DB:-postgres}
      - DB_SERVICE_PASSWORD=${SERVICE_PASSWORD_DBSERVICE}

  # One-shot: applies supabase/migrations (each once) and the seed on a fresh database.
  migrate:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    restart: "no"
    exclude_from_hc: true
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}@${POSTGRES_HOST:-62.238.60.119}:${POSTGRES_PORT:-6000}/${POSTGRES_DB:-postgres}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy

  auth:
    image: supabase/gotrue:v2.177.0
    restart: unless-stopped
    environment:
      - GOTRUE_API_HOST=0.0.0.0
      - GOTRUE_API_PORT=9999
      # First sign-ins write several rows; allow headroom if the database is remote.
      - GOTRUE_API_MAX_REQUEST_DURATION=30s
      - API_EXTERNAL_URL=http://gateway:8000
      - GOTRUE_DB_DRIVER=postgres
      - GOTRUE_DB_DATABASE_URL=postgres://supabase_auth_admin:${SERVICE_PASSWORD_DBSERVICE}@${POSTGRES_HOST:-62.238.60.119}:${POSTGRES_PORT:-6000}/${POSTGRES_DB:-postgres}
      - GOTRUE_SITE_URL=${SITE_URL:-${SERVICE_FQDN_APP_3000:-http://localhost:3000}}
      - GOTRUE_DISABLE_SIGNUP=false
      - GOTRUE_JWT_ADMIN_ROLES=service_role
      - GOTRUE_JWT_AUD=authenticated
      - GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated
      - GOTRUE_JWT_EXP=3600
      - GOTRUE_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - GOTRUE_EXTERNAL_EMAIL_ENABLED=true
      - GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED=false
      - GOTRUE_EXTERNAL_PHONE_ENABLED=false
      - GOTRUE_MAILER_AUTOCONFIRM=false
      # Auth's own emails (rare; the app sends sign-in links itself) via Resend SMTP.
      - GOTRUE_SMTP_HOST=smtp.resend.com
      - GOTRUE_SMTP_PORT=465
      - GOTRUE_SMTP_USER=resend
      - GOTRUE_SMTP_PASS=${RESEND_API_KEY:?Set RESEND_API_KEY in Coolify}
      - GOTRUE_SMTP_ADMIN_EMAIL=${SMTP_ADMIN_EMAIL:-support@betpreneur.ng}
      - GOTRUE_SMTP_SENDER_NAME=C8 Tech Summit
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    command: ["postgrest"]
    environment:
      - PGRST_DB_URI=postgres://authenticator:${SERVICE_PASSWORD_DBSERVICE}@${POSTGRES_HOST:-62.238.60.119}:${POSTGRES_PORT:-6000}/${POSTGRES_DB:-postgres}
      - PGRST_DB_SCHEMAS=public,storage,graphql_public
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - PGRST_DB_USE_LEGACY_GUCS=false
      - PGRST_APP_SETTINGS_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - PGRST_APP_SETTINGS_JWT_EXP=3600
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  storage:
    image: supabase/storage-api:v1.25.7
    restart: unless-stopped
    environment:
      # No ANON_KEY/SERVICE_KEY: Storage signs its own from PGRST_JWT_SECRET.
      - POSTGREST_URL=http://rest:3000
      - PGRST_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - DATABASE_URL=postgres://supabase_storage_admin:${SERVICE_PASSWORD_DBSERVICE}@${POSTGRES_HOST:-62.238.60.119}:${POSTGRES_PORT:-6000}/${POSTGRES_DB:-postgres}
      - FILE_SIZE_LIMIT=52428800
      - STORAGE_BACKEND=file
      - FILE_STORAGE_BACKEND_PATH=/var/lib/storage
      - TENANT_ID=stub
      - REGION=stub
      - GLOBAL_S3_BUCKET=stub
      - ENABLE_IMAGE_TRANSFORMATION=false
    volumes:
      # Uploaded images (logos, speaker photos, blog images). Back this up.
      - storage-data:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      rest:
        condition: service_started

  # Internal API gateway (not exposed): routes /auth/v1, /rest/v1, /storage/v1.
  gateway:
    build:
      context: ./docker/gateway
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_started
      storage:
        condition: service_healthy

volumes:
  storage-data:
